<!doctype html>
<html lang="en" class="rm-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rahul Mehra — Revenue Strategy, Aviation, Project Management</title>
    <meta
      name="description"
      content="Rahul Mehra — Product Owner in Revenue Management at Air India. Revenue strategy, aviation, project management, strategy interview coaching and a PMP® learning path."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Figtree:wght@400;500;600&family=Plus+Jakarta+Sans:wght@800&display=swap"
    />
    <script>
      // Apply the visitor's saved theme before first paint to avoid a flash; light by default.
      (function () {
        var t = 'light';
        try {
          var s = localStorage.getItem('rm-theme');
          if (s === 'light' || s === 'dark') t = s;
        } catch (e) {}
        document.documentElement.className = 'rm-' + t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
